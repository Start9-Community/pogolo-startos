server {
    listen 5663;
    server_name _;
    charset utf-8;

    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    # hashrate history written by the sampler daemon
    location = /history.csv {
        alias /data/hashrate.csv;
        default_type text/csv;
        add_header Cache-Control no-store;
    }

    # pogolo's read-only API
    location /api/ {
        proxy_pass http://127.0.0.1:5662;
        add_header Cache-Control no-store;
    }
}
